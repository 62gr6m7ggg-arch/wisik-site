name: C05-bron synchroniseren
on:
  push:
    branches: [publish/c05-roadie-20261119]
    paths: [.github/workflows/sync-c05-roadie.yml]
permissions:
  contents: write
concurrency:
  group: sync-c05-roadie-20261119
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publish/c05-roadie-20261119
          fetch-depth: 1
      - name: Neem de goedgekeurde C05-bestanden over
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 --connect-timeout 20 --max-time 120 --max-filesize 25165824 'https://e1c1102e.wisik-site.pages.dev/films/rekenklaar/C05/flirt.mp4' --output 'public/films/rekenklaar/C05/flirt.mp4'
          echo '9171de2ed9c823315df93014503a6c142894f39249b7ff16cde74f49711d476b  public/films/rekenklaar/C05/flirt.mp4' | sha256sum --check --status
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 --connect-timeout 20 --max-time 120 --max-filesize 25165824 'https://e1c1102e.wisik-site.pages.dev/films/rekenklaar/C05/poster.jpg' --output 'public/films/rekenklaar/C05/poster.jpg'
          echo 'dd42eafc3946f1a9b1d69e89cf7802236714a8c40d1aae641ceff013835e2cc1  public/films/rekenklaar/C05/poster.jpg' | sha256sum --check --status
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 --connect-timeout 20 --max-time 120 --max-filesize 25165824 'https://e1c1102e.wisik-site.pages.dev/films/rekenklaar/C05/captions.vtt' --output 'public/films/rekenklaar/C05/captions.vtt'
          echo '2616b094136535af71ac6a0f79d0c7df70a31bb18cf446dbf036757d1ca30e8a  public/films/rekenklaar/C05/captions.vtt' | sha256sum --check --status
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 --connect-timeout 20 --max-time 120 --max-filesize 25165824 'https://e1c1102e.wisik-site.pages.dev/films/rekenklaar/C05/transcript.html' --output 'public/films/rekenklaar/C05/transcript.html'
          echo '1bce8bfb4876ddcf1e8c5fef651db7cb2ca041bc32b47e7a3cdbbad5f78b6555  public/films/rekenklaar/C05/transcript.html' | sha256sum --check --status
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 --connect-timeout 20 --max-time 120 --max-filesize 25165824 'https://e1c1102e.wisik-site.pages.dev/assets/data/grabbelton-videos.json' --output 'public/assets/data/grabbelton-videos.json'
          echo 'cfb993c1d1c165d693c43d76d60400575dba8cdbee80b39223733ab030f7a765  public/assets/data/grabbelton-videos.json' | sha256sum --check --status
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 --connect-timeout 20 --max-time 120 --max-filesize 25165824 'https://e1c1102e.wisik-site.pages.dev/assets/data/flirt-content-review.json' --output 'public/assets/data/flirt-content-review.json'
          echo '36499c4a6f078b3fab865722eda79cddae3d15c6a97a9fc1937550a865c3861e  public/assets/data/flirt-content-review.json' | sha256sum --check --status
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'public/films/rekenklaar/C05/flirt.mp4' 'public/films/rekenklaar/C05/poster.jpg' 'public/films/rekenklaar/C05/captions.vtt' 'public/films/rekenklaar/C05/transcript.html' 'public/assets/data/grabbelton-videos.json' 'public/assets/data/flirt-content-review.json'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'C05: publiceer de goedgekeurde Roadie-film over straal en diameter'
          git push origin HEAD:publish/c05-roadie-20261119
