name: Neem de gepubliceerde D06 over
on:
  push:
    branches: [publish/d06-roadie-festivalbord-20261119]
    paths: ['.github/workflows/d06-roadie-overdracht.yml']
permissions:
  contents: write
jobs:
  overnemen:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publish/d06-roadie-festivalbord-20261119
      - name: Neem de zes vrijgegeven bestanden over van de vaste productieversie
        shell: bash
        run: |
          set -euo pipefail
          deploy='https://d034ada8.wisik-site.pages.dev'
          stage="$(mktemp -d)"
          trap 'rm -rf -- "$stage"' EXIT
          while read -r digest path; do
            mkdir -p "$stage/$(dirname "$path")"
            curl --fail --silent --show-error --location --retry 2 --max-time 75 --max-filesize 25165824 "$deploy/${path#public/}" --output "$stage/$path"
            printf '%s  %s\n' "$digest" "$stage/$path" | sha256sum --check --status
            install -m 0644 "$stage/$path" "$path"
            git add -- "$path"
          done <<'BESTANDEN'
          16346c67c5e0eb1f92d24c0812c3893507d61ee3740a8b914d58c60f722510d0 public/assets/data/flirt-content-review.json
          fc2fa66342e8bc27dc45af6fa2d1c6ff505e407602403bd420bcd7a0ca67a54f public/assets/data/grabbelton-videos.json
          88c352f1810eba43b7bc394160467923668bb42473cb9f38d04ab1476f8ec6cf public/films/rekenklaar/D06/captions.vtt
          5a02de2cc9b64b3e93482fcec109fa95fbcfa87a550f85499e8b730689338c6d public/films/rekenklaar/D06/flirt.mp4
          c7b1f2d2568f440e0dba513df80d62cd6433c21f7a2b6bf735461755d3b33b69 public/films/rekenklaar/D06/poster.jpg
          b15a72324203ea512feb2b033c2a294b4bd8a415315a112e500d426997a6aef2 public/films/rekenklaar/D06/transcript.html
          BESTANDEN
          test "$(git diff --cached --name-only | wc -l)" -eq 6
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "D06: neem de goedgekeurde Roadie-film met festivalbord over"
          git push origin HEAD:publish/d06-roadie-festivalbord-20261119
