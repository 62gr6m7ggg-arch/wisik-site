name: Neem de gepubliceerde B02 over
on:
  push:
    branches: [publish/b02-roadie-houtoven-20261120]
    paths: ['.github/workflows/b02-roadie-overdracht.yml']
permissions:
  contents: write
jobs:
  overnemen:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publish/b02-roadie-houtoven-20261120
      - name: Neem de zes vrijgegeven bestanden over van de vaste productieversie
        shell: bash
        run: |
          set -euo pipefail
          deploy='https://af705305.wisik-site.pages.dev'
          stage="$(mktemp -d)"
          trap 'rm -rf -- "$stage"' EXIT
          while read -r digest path; do
            mkdir -p "$stage/$(dirname "$path")"
            curl --fail --silent --show-error --location --retry 2 --max-time 75 --max-filesize 25165824 "$deploy/${path#public/}" --output "$stage/$path"
            printf '%s  %s\n' "$digest" "$stage/$path" | sha256sum --check --status
            install -m 0644 "$stage/$path" "$path"
            git add -- "$path"
          done <<'BESTANDEN'
          f6039e738172025e03a2f9f707364382f9c9ba1f6f2c4a898c079cb64876ce02  public/assets/data/flirt-content-review.json
          0b14a8ba1b5f5abee1e7768f6c1297aba7debf188fc051f6303ac2934fa3a264  public/assets/data/grabbelton-videos.json
          47c0115be3437b1a6178d4366cca5893ec010a8758bcf232474b0ac30e2761a1  public/films/rekenklaar/B02/captions.vtt
          0389fd5b7b6fbd04eef94d1c7cf315878f61ae99cdfb73eadf3dfd6c92f99846  public/films/rekenklaar/B02/flirt.mp4
          001de0524761fa7e72a6de56b6a7d6f1f7274fed840d13fb81c9109232749aa7  public/films/rekenklaar/B02/poster.jpg
          d13a23df4e0c020f169daabd13c8bfa553315927a3db05da25761ab5fdaa01c1  public/films/rekenklaar/B02/transcript.html
          BESTANDEN
          test "$(git diff --cached --name-only | wc -l)" -eq 6
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "B02: neem de goedgekeurde Roadie-film bij de houtoven over"
          git push origin HEAD:publish/b02-roadie-houtoven-20261120
