name: C01 reeds gepubliceerde bestanden synchroniseren
on:
  push:
    branches: [publish/c01-roadie-20261118]
    paths: [.github/workflows/c01-source-sync.yml]
permissions:
  contents: write
jobs:
  sync:
    if: github.ref == 'refs/heads/publish/c01-roadie-20261118'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publish/c01-roadie-20261118
      - name: Exact gepubliceerde C01 overnemen
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, subprocess
          expected = {'public/films/rekenklaar/C01/flirt.mp4': 'e97dcd629096ee9b5cc6604f057176bce945f288e5b25f6305ce954a98987bc4', 'public/films/rekenklaar/C01/poster.jpg': '098716f542051041ff72b6b4451c2c147a6b7099d02215946875d5b5d4e3ccd0', 'public/films/rekenklaar/C01/captions.vtt': '496e4c5b0a706edf260b8981d415cbde2abaf927684996f0f0fd53b62e2a3c5c', 'public/films/rekenklaar/C01/transcript.html': 'c9f21ae32627a0d182b17cbaa06e3903258101ff08ca4d4402f7242796e9df3b', 'public/assets/data/grabbelton-videos.json': 'f96ebf63baa7866d3898220813ce1685a574b9f931d8baa4c7ddfefeefeda7b3', 'public/assets/data/flirt-content-review.json': '74b6ef35d9130b3921f5f7835a5a5a7afa9c3e27722d291f5eeb0a3847b73884'}
          for name, sha in expected.items():
              url = 'https://898820bf.wisik-site.pages.dev/' + name.removeprefix('public/')
              subprocess.run(['curl', '--fail', '--silent', '--show-error', '--location', '--proto', '=https', '--proto-redir', '=https', '--connect-timeout', '15', '--max-time', '120', '--max-filesize', '26214400', '--output', name, '--', url], check=True)
              content = pathlib.Path(name).read_bytes()
              assert hashlib.sha256(content).hexdigest() == sha, name + ': verkeerde inhoud'
              pathlib.Path(name).write_bytes(content)
              print(name, len(content), sha)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/films/rekenklaar/C01 public/assets/data/grabbelton-videos.json public/assets/data/flirt-content-review.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'C01: synchroniseer goedgekeurde Cloudflare-publicatie'
          git push origin HEAD:refs/heads/publish/c01-roadie-20261118
