name: A04 beginplaatje synchroniseren
on:
  push:
    branches: [publish/a04-roadie-20261117]
    paths: [.github/workflows/a04-poster-sync.yml]
permissions:
  contents: write
jobs:
  sync:
    if: github.ref == 'refs/heads/publish/a04-roadie-20261117'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publish/a04-roadie-20261117
          fetch-depth: 0
      - name: Gepubliceerd eerste shot overnemen
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin main
          git merge --no-edit origin/main
          python3 - <<'PY'
          import hashlib, pathlib, subprocess
          expected = {
            'public/films/rekenklaar/A04/poster.jpg': 'cc422431a7e6df7df11f2f86350904cba13c23558ba85c93647469a7f0ac3f1a',
            'public/assets/data/grabbelton-videos.json': '433ab77663925f239b85d236a6001e45c68389b567a69ae6c7d1c53f1f511a81',
            'public/assets/data/flirt-content-review.json': 'c7b2f39115e3ee71e9d8b4393fe9f448385a3e20af4a4796bc38986564a8601b',
          }
          for name, sha in expected.items():
              url = 'https://bb7a81cf.wisik-site.pages.dev/' + name.removeprefix('public/')
              subprocess.run(['curl','--fail','--silent','--show-error','--location','--proto','=https','--proto-redir','=https','--connect-timeout','15','--max-time','120','--max-filesize','1048576','--output',name,'--',url], check=True)
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() == sha, name
              print(name, sha)
          assert hashlib.sha256(pathlib.Path('public/films/rekenklaar/A04/flirt.mp4').read_bytes()).hexdigest() == '45533dbab795b4f2ee8237b9df7b34c05a5d0916702cea59492d4d11d756459a'
          PY
          git add public/films/rekenklaar/A04/poster.jpg public/assets/data/grabbelton-videos.json public/assets/data/flirt-content-review.json
          if ! git diff --cached --quiet; then git commit -m 'A04: eerste filmshot als beginplaatje'; fi
          git push origin HEAD:refs/heads/publish/a04-roadie-20261117
