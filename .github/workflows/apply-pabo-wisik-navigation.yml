name: Pas Pabo-Wisik-navigatie toe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-pabo-wisik-navigation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pabo-wisik-navigation
          fetch-depth: 0
      - name: Pas navigatie- en finalisatiepatch toe
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'const APP_VERSION = "1.5.9"' public/apps/pabo-rekenklaar/index.html; then
            python scripts/patch-pabo-wisik-navigation.py
          fi
          if grep -q '<span id="homeVersion">1.5.9</span>' public/apps/pabo-rekenklaar/index.html; then
            python scripts/finalize-pabo-wisik-navigation.py
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Controleer ingesloten JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('public/apps/pabo-rekenklaar/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>([\s\S]*?)</script>', html)
          if len(scripts) != 1:
              raise SystemExit(f'Verwacht exact één ingesloten script, gevonden {len(scripts)}')
          Path('/tmp/pabo-rekenklaar.js').write_text(scripts[0], encoding='utf-8')
          PY
          node --check /tmp/pabo-rekenklaar.js
      - name: Leg wijziging vast op featurebranch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "wisik-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/apps/pabo-rekenklaar/index.html
          if git diff --cached --quiet; then
            echo 'Geen aanvullende Pabo-wijziging nodig.'
            exit 0
          fi
          git commit -m "Finaliseer permanente uitgang naar het Wisik-terrein"
          git push origin HEAD:feature/pabo-wisik-navigation

# Eenmalige migratieworkflow; verwijderen na de geslaagde merge.
