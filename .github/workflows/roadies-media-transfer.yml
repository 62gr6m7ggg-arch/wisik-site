name: Roadies goedgekeurde film overzetten
on:
  push:
    branches: [publish/stoicheia-roadies-20261118]
    paths: [.github/workflows/roadies-media-transfer.yml]
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Haal de goedgekeurde bestanden op en controleer hun identiteit
        shell: bash
        run: |
          set -euo pipefail
          destination=public/apps/stoicheia/roadies
          mkdir -p "$destination"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --retry 3 --connect-timeout 15 --max-time 120 --max-filesize 12000000 --output "$destination/zoeklicht.mp4" https://511581ac.wisik-site.pages.dev/apps/stoicheia/roadies/zoeklicht.mp4
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --retry 3 --connect-timeout 15 --max-time 120 --max-filesize 1000000 --output "$destination/zoeklicht.jpg" https://511581ac.wisik-site.pages.dev/apps/stoicheia/roadies/zoeklicht.jpg
          echo '388bb901a8b0430a6045e30b20b170920733da6e69ec7f4c0da2df978bf33d34  public/apps/stoicheia/roadies/zoeklicht.mp4' | sha256sum --check
          echo '1856c2ec447d7d30d05a22ab07de481e5c91a3a98f71cbfe85798ce278dab669  public/apps/stoicheia/roadies/zoeklicht.jpg' | sha256sum --check
          test "$(stat -c %s "$destination/zoeklicht.mp4")" = 11144663
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$destination/zoeklicht.mp4" "$destination/zoeklicht.jpg"
          git commit -m 'Stoicheia: voeg goedgekeurde zoeklichtfilm en poster toe'
          git push origin HEAD:refs/heads/publish/stoicheia-roadies-20261118
