name: B05 reeds gepubliceerde bestanden synchroniseren
on:
  push:
    branches: [publish/b05-roadie-20261117]
    paths: [.github/workflows/b05-source-sync.yml]
permissions:
  contents: write
jobs:
  sync:
    if: github.ref == 'refs/heads/publish/b05-roadie-20261117'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publish/b05-roadie-20261117
      - name: Exact gepubliceerde B05 overnemen
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, subprocess
          expected = {'public/films/rekenklaar/B05/flirt.mp4': '16d28accfa73e843eca9662b7f14d5eda0f58473227df4a6b2624150cd775f86', 'public/films/rekenklaar/B05/poster.jpg': '886112c814a71ff0d449f2cba4451044ee106a704d341445308e15b7f61d79b1', 'public/films/rekenklaar/B05/captions.vtt': 'c3108592a1bf022153ce2f969dc491681823f231175d651637c6e9aaa58986ce', 'public/films/rekenklaar/B05/transcript.html': '701101299916b57fe065bb19a190cba2522527f0f3fd57ec6772a54f1ebcd329', 'public/assets/data/grabbelton-videos.json': 'a511c09595c3a9d25400cf1bb4d4a7f3282545f6e861154ab075350c4e16e1b3', 'public/assets/data/flirt-content-review.json': 'fd93cc37bcef21506e9673ccfc7efafc13208a050ec3a403e0b3c64b5a2e801c'}
          for name, sha in expected.items():
              url = 'https://0415fafc.wisik-site.pages.dev/' + name.removeprefix('public/')
              subprocess.run(['curl', '--fail', '--silent', '--show-error', '--location', '--proto', '=https', '--proto-redir', '=https', '--connect-timeout', '15', '--max-time', '120', '--max-filesize', '26214400', '--output', name, '--', url], check=True)
              content = pathlib.Path(name).read_bytes()
              assert hashlib.sha256(content).hexdigest() == sha, name + ': verkeerde inhoud'
              pathlib.Path(name).write_bytes(content)
              print(name, len(content), sha)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/films/rekenklaar/B05 public/assets/data/grabbelton-videos.json public/assets/data/flirt-content-review.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'B05: synchroniseer goedgekeurde Cloudflare-publicatie'
          git push origin HEAD:refs/heads/publish/b05-roadie-20261117
