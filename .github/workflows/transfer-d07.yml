name: Synchroniseer gepubliceerde D07
on:
  push:
    branches: [publish/d07-festivalbar]
    paths: ['.github/workflows/transfer-d07.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Neem gecontroleerde productieversie over
        run: |
          set -euo pipefail
          while read -r hash file; do
            curl -fsSL "https://4affbcf2.wisik-site.pages.dev/${file#public/}" -o "$file"
            echo "$hash  $file" | sha256sum -c -
            git add "$file"
          done <<'FILES'
          bf4b0eba2705810a19c355c954460a4979780888a8f24755281302de4f385498  public/assets/data/flirt-content-review.json
          3314e302813da2771985a705e7111931d887f89f55ae75685ccb216631d88a0a  public/assets/data/grabbelton-videos.json
          4755d11a41d21c58f1c72544134eb272b90fa239cef76ba754a7701bf128a6db  public/films/rekenklaar/D07/captions.vtt
          3c74bdd74062bfa35fecca6595ea6bddd5ff64db3f2fc3e345bacb86f47622c5  public/films/rekenklaar/D07/flirt.mp4
          4e9e7f557e5f1cae045c114ba75f22aecf8d921cd34c1d13f47f61e84648e814  public/films/rekenklaar/D07/poster.jpg
          a875dd7dcceaf5b6c3c8f1bce7d3e4fe32f09fa8963bb936faed5f3ba3f95d51  public/films/rekenklaar/D07/transcript.html
          FILES
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'D07: neem de gepubliceerde festivalbarfilm over'
          git push origin HEAD:publish/d07-festivalbar
