name: Geitenstem kandidaat voorbereiden
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gonio-goat-prepare
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/feat/gonio-geitenstem-20261107'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gonio-geitenstem-20261107
      - name: Installeer de audio-omzetter
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Bereid CC0-opname en gerichte integratie voor
        run: |
          python tools/gonio/prepare-goat.py
          node --check public/rafelrand/sinus-s-en-de-geit/mixer.js
          node scripts/test-gonio.mjs
      - name: Commit uitsluitend kandidaatbestanden
        run: |
          git config user.name 'Wisik preparation bot'
          git config user.email 'wisik-preparation@users.noreply.github.com'
          git add public/rafelrand/sinus-s-en-de-geit/index.html public/rafelrand/sinus-s-en-de-geit/goat-bleat.wav public/rafelrand/sinus-s-en-de-geit/goat-source.json
          if ! git diff --cached --quiet; then
            git commit -m 'build(gonio): integrate licensed real goat and continuous pitch controls'
            git push origin HEAD:refs/heads/feat/gonio-geitenstem-20261107
          fi
      - name: Bewaar kandidaat voor onafhankelijke controle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gonio-goat-candidate
          path: test-artifacts/goat-preparation/
          if-no-files-found: warn
