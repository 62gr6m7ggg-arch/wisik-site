name: Ruim tijdelijke Pabo-correctiebestanden op

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-pabo-navigation.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cleanup-pabo-navigation
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wacht tot Wisik 0.1.6 op main staat
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 36); do
            git fetch origin main
            git reset --hard origin/main
            if grep -q '"version": "0.1.6"' package.json \
              && grep -q 'WISIK_SITE_VERSION = "0.1.6"' public/assets/js/site-data.js \
              && grep -q './wisik-bridge.js?v=1.0.0' public/apps/pabo-rekenklaar/index.html \
              && grep -q 'name="Attractieversie"' public/kladblok/index.html; then
              ready=1
              break
            fi
            sleep 10
          done
          test "$ready" -eq 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verwijder alleen tijdelijke correctiebestanden
        shell: bash
        run: |
          set -euo pipefail
          git rm --ignore-unmatch \
            .github/workflows/apply-pabo-wisik-bridge.yml \
            .github/workflows/apply-kladblok-context.yml \
            .github/workflows/finalize-pabo-navigation.yml \
            .github/workflows/cleanup-pabo-navigation.yml \
            scripts/patch-pabo-wisik-bridge.py \
            scripts/patch-kladblok-context.py \
            scripts/finalize-pabo-navigation.py
          npm run check
      - name: Leg de opgeschoonde eindversie vast
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "wisik-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Ruim tijdelijke Pabo-correctiebestanden op"
          git push origin HEAD:main
