name: Analyseer voice-over in oude slotkaarten

on:
  push:
    branches:
      - fix/flirt-slotbeeld-zonder-herstelset

permissions:
  contents: write

jobs:
  analyze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/flirt-slotbeeld-zonder-herstelset
      - name: Installeer analysehulpmiddelen
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check pillow
      - name: Meet spraakoverlap
        run: python scripts/analyze-flirt-endcards.py
      - name: Commit analysebewijs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/flirt-endcard-speech-analysis-2026-09-09.json
          git diff --cached --quiet && exit 0
          git commit -m 'Leg spraakoverlap met oude flirt-slotkaarten vast'
          git push origin HEAD:fix/flirt-slotbeeld-zonder-herstelset
