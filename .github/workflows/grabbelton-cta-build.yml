name: Build Grabbelton vervolgroute

on:
  push:
    branches:
      - feat/grabbelton-verder-oefenen

permissions:
  contents: write

jobs:
  build-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/grabbelton-verder-oefenen
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bouw klikbare eindkaart en deep-link
        run: python scripts/build-grabbelton-cta.py
      - name: Vernieuw Pabo-auditbewijs
        run: npm run audit:update
      - name: Vernieuw Ruimteklaar-auditbewijs
        run: node scripts/audit-space-release.mjs --write
      - name: Controleer volledige release
        run: npm run check
      - name: Commit gecontroleerde wijziging
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json public scripts/test-grabbelton-cta.mjs scripts/build-grabbelton-cta.py
          git diff --cached --quiet && exit 0
          git commit -m 'Maak flirt-eindkaart klikbaar naar gericht oefenen'
          git push origin HEAD:feat/grabbelton-verder-oefenen
