name: Diagnose D05 poster prod en Cloudflare preview
on:
  push:
    branches: [diagnostic/d05-live-20261111]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Vergelijk routes zonder vroegtijdig stoppen
        run: |
          set +e
          for host in wisik.nl 0fefd89f.wisik-site.pages.dev; do
            for route in /films/rekenklaar/D05/ /films/rekenklaar/D05/index.html /grabbelton/ /films/rekenklaar/D05/poster.jpg; do
              echo "=== $host$route ==="
              curl --location --silent --show-error --max-time 18 --output /tmp/item --write-out 'code=%{http_code} type=%{content_type} bytes=%{size_download} final=%{url_effective}\n' "https://$host$route?verify=20261111-1530"
              if test "$route" = "/films/rekenklaar/D05/" || test "$route" = "/films/rekenklaar/D05/index.html"; then
                grep -F 'id="roadiePoster"' /tmp/item >/dev/null && echo "POSTER_HTML_OK" || echo "NO_POSTER_HTML"
              fi
            done
          done
