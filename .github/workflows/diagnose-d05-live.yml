name: Diagnose D05 live levering
on:
  push:
    branches: [diagnostic/d05-live-20261111]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Vergelijk live productie, preview en GitHub-bron
        shell: bash
        run: |
          set +e
          echo "=== GitHub source ==="
          sha256sum public/films/rekenklaar/D05/flirt.mp4
          wc -c public/films/rekenklaar/D05/flirt.mp4
          for host in wisik.nl 755c9cc8.wisik-site.pages.dev publish-d05-roadie-20261111.wisik-site.pages.dev; do
            echo "=== host: $host ==="
            url="https://$host/films/rekenklaar/D05/flirt.mp4?v=0.1.32-roadie-d05-20261111-verify"
            curl --connect-timeout 12 --max-time 45 --retry 1 --location --silent --show-error -H 'Cache-Control: no-cache' -D /tmp/d05.headers -o /tmp/d05.mp4 -w 'http_code=%{http_code} bytes=%{size_download} final=%{url_effective} content_type=%{content_type}\n' "$url"
            result=$?
            echo "curl exit: $result"
            grep -iE '^(HTTP/|content-type:|content-length:|cache-control:|cf-cache-status:|etag:|age:)' /tmp/d05.headers | tail -n 13
            if test "$result" -eq 0; then sha256sum /tmp/d05.mp4; wc -c /tmp/d05.mp4; fi
            echo "catalog:"
            curl --connect-timeout 12 --max-time 25 --location --silent --show-error -H 'Cache-Control: no-cache' "https://$host/assets/data/grabbelton-videos.json?verify=20261111-2" -o /tmp/d05-catalog.json -w 'catalog_http=%{http_code} bytes=%{size_download}\n'
            python3 - <<'PY'
          import json
          try:
            j=json.load(open('/tmp/d05-catalog.json'))
            d=next((v for v in j['videos'] if v.get('target',{}).get('misconceptionCode')=='D05'),None)
            print('D05 catalog record:',{k:d.get(k) for k in ('release','durationSeconds','source','captionsBurnedIn')} if d else None)
          except Exception as ex:
            print('Catalog parse failed:',str(ex))
          PY
            echo "script uses D05 bypass:"
            curl --connect-timeout 12 --max-time 25 --location --silent --show-error -H 'Cache-Control: no-cache' "https://$host/assets/js/grabbelton-core.js?v=0.1.32" -o /tmp/d05-core.js -w 'core_http=%{http_code} bytes=%{size_download}\n'
            grep -o 'code === "D05"' /tmp/d05-core.js | head -n 1 || true
          done
