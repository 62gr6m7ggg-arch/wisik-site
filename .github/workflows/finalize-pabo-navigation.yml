name: Finaliseer Pabo-navigatie en Kladblokcontext

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-pabo-navigation.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-pabo-navigation
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Pas alle correcties toe
        run: python scripts/finalize-pabo-navigation.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Voer alle kwaliteitscontroles uit
        run: npm run check
      - name: Leg de definitieve correcties vast
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && test -z "$(git status --porcelain)"; then
            echo "Alle correcties stonden al goed."
            exit 0
          fi
          git config user.name "wisik-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public package.json README.md TEST-RESULTS.md scripts
          git commit -m "Verbeter navigatie uit Pabo Rekenklaar en Kladblokcontext"
          git push origin HEAD:main
