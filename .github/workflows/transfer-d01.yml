name: Synchroniseer gepubliceerde D01
on:
  push:
    branches: [publish/d01-scanner]
    paths: ['.github/workflows/transfer-d01.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Neem gecontroleerde productieversie over
        run: |
          set -euo pipefail
          while read -r hash file; do
            curl -fsSL "https://919ef985.wisik-site.pages.dev/${file#public/}" -o "$file"
            echo "$hash  $file" | sha256sum -c -
            git add "$file"
          done <<'FILES'
          bdfeb2b863267074e4ca54e3e229b234d6d0968e1b0e7380c03324198ef2b8b2  public/assets/data/flirt-content-review.json
          52e6a09a49494b6ba932b8c2a32fe2ce07ae07ec5e442438917008c3a9603fd4  public/assets/data/grabbelton-videos.json
          8b728b0cf14e1f802cca93dea4eb72aa6b11f1a87f64e41e25f27a17033bb513  public/films/rekenklaar/D01/captions.vtt
          e561f8b7d4f936b9cf051cc661ba78ef6d66e87af01751da4541d5bc7b095279  public/films/rekenklaar/D01/flirt.mp4
          a9c1db1912e95f633393b5ba2e149962d1abfeedbfd00d29aed51bbfd9a8166f  public/films/rekenklaar/D01/poster.jpg
          2cc4f1bb3b84f2b2bfaef079291b31d277de5ce3eb147f1ba071e78fb569f348  public/films/rekenklaar/D01/transcript.html
          FILES
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'D01: neem de gepubliceerde festivalbarfilm over'
          git push origin HEAD:publish/d01-scanner
