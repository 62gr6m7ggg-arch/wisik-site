name: Ruimteklaar constructie vervolgcontrole
on:
  push:
    branches: [fix/construction-next-step]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/space-tent/package-lock.json
      - run: npm ci
        working-directory: tools/space-tent
      - run: npm run build && npm run audit:build && npm test && node scripts/build-review.mjs
        working-directory: tools/space-tent
      - name: Install browser test tools
        run: |
          npm install --prefix /tmp/next-browser --no-save playwright@1.56.1
          /tmp/next-browser/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Verify next step on desktop and mobile
        working-directory: tools/space-tent
        env:
          PLAYWRIGHT_MODULE: /tmp/next-browser/node_modules/playwright/index.mjs
        run: node scripts/check-construction-next-browser.mjs
      - name: Bind verified source and production assets
        run: |
          rm -rf public/apps/ruimteklaar/assets
          cp -a tools/space-tent/.space-dist/. public/apps/ruimteklaar/
          cp -a tools/space-tent/.audit-dist/. tools/space-tent/audit-runtime/
          node scripts/audit-space-release.mjs --write
          node scripts/audit-ruimteklaar-review.mjs --write
          npm run build
      - name: Commit verified assets to isolated branch
        run: |
          test "$(git ls-remote origin refs/heads/fix/construction-next-step | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/apps/ruimteklaar tools/space-tent/audit-runtime public/assets/data/ruimteklaar-release-audit.json server/ruimteklaar-test-assets.mjs server/ruimteklaar-test-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Build and verify construction next-step release'
            git push origin HEAD:fix/construction-next-step
          fi
