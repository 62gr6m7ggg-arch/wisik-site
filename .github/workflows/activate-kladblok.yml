name: Activeer gratis Wisik-Kladblok

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/activate-kladblok.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Vraag eenmalige FormSubmit-activatie aan
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --silent --show-error --fail-with-body \
            --request POST \
            --header 'Content-Type: application/json' \
            --header 'Accept: application/json' \
            --data '{"_subject":"Activeer het Wisik-Kladblok","_template":"table","_captcha":"false","Categorie":"Technische activatie","Bericht":"Eenmalige technische activatie van het Wisik-Kladblok. Na bevestiging worden toekomstige notities vanuit wisik.nl per e-mail bezorgd."}' \
            'https://formsubmit.co/ajax/kladblok@wisik.nl')
          echo "$response"
