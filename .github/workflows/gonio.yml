name: Gonio proeftent controle

on:
  pull_request:
    paths:
      - 'public/rafelrand/**'
      - 'scripts/test-gonio.mjs'
      - 'tests/gonio-browser.py'
      - '.github/workflows/gonio.yml'
  push:
    branches: [main]
    paths:
      - 'public/rafelrand/**'
      - 'scripts/test-gonio.mjs'
      - 'tests/gonio-browser.py'
      - '.github/workflows/gonio.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gonio-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gonio:
    name: Gonio inhoud en browsers
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Controleer productiewiskunde en ingang
        run: node scripts/test-gonio.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installeer vastgezette browsertestomgeving
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium webkit
      - name: Test Chromium en WebKit op mobiel en desktop
        run: python tests/gonio-browser.py
      - name: Controleer bestaande live tent bij uitsluitend testwijzigingen
        if: github.event_name == 'pull_request'
        env:
          GONIO_BASE: https://wisik.nl
        run: |
          if git diff --quiet HEAD^ HEAD -- public/; then
            python tests/gonio-browser.py
          else
            echo "Publieke bestanden wijzigen; livecontrole volgt na de normale publicatie op main."
          fi
      - name: Controleer normale Cloudflare-publicatie en live bediening
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GONIO_BASE: https://wisik.nl
        run: python tests/gonio-browser.py
      - name: Bewaar testresultaten en schermafbeeldingen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gonio-browser-evidence
          path: test-artifacts/gonio/
          if-no-files-found: warn
