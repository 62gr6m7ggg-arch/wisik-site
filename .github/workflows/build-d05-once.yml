name: Tijdelijke D05 Roadie montage

on:
  push:
    branches: [publish/d05-roadie-20261111]

permissions:
  contents: write

concurrency:
  group: roadie-d05-build
  cancel-in-progress: true

jobs:
  render-and-commit:
    name: Bouw D05 film en controlebewijs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      D05_VIDEO_URL: "https://files2.heygen.ai/aws_pacific/avatar_tmp/8b8d53d3d3024068b89baa910a8cdb5c/c12a2f522f453b6a555b12772f1e28b0.mp4?Expires=1795011219&Signature=HbBfRcpD4nDC6attwbcyk2p2BtkRjJvizJYXOJfvvFEtcKLb4wHhnBNtQEtQhII4EKREJ2eXlrpzWIBKeWbtfS~fkPMHmXDAQW4ZRYAgPph7~I2cs9JjIT-Cbc5l7jgPR5Dh-0h3rlvaTiekFYnnIsKmEC--~LHDqeujxufx5IIycxyAG1mEfDOjlegxAsiKz4RTBdGcj5XMKNJKLCJSQxQhEC4Ok1ohpKlsTMfpnBLH9up0Xib6i2QnJ-j-lrUCbBK4-QDcdPfb2tH9nsN9hVec23iSxfGQ1xGBBHNdXJWfBpeTzIVo4i20osNYgmHiRk1Wo-gtK0Xr13axm~uqFA__&Key-Pair-Id=K38HBHX5LX3X2H"
      D05_SUBTITLE_URL: "https://files2.heygen.ai/aws_pacific/avatar_tmp/8b8d53d3d3024068b89baa910a8cdb5c/subtitles_c12a2f522f453b6a555b12772f1e28b0.srt?Expires=1795011231&Signature=avee6CzBNqd76PvIpp9rEn9xeG~clTzcDzOkn78mSCc~kSDo8BJADu5FFOjTFd5HsnVFrv5jhcR12KjYNsY1nrFHwarcm7VvKrNtFhRG3~ZN3wwPoari7EgrUKyjpfQo7HGM2M40ch~cZH1X498KQZJFZ7ZZiwjO5Ntns9457igrmr6eRt~2si7rj3kH~hTOwhz96D3d776bRo6kNJNLoHTOrjI9B2VI8Ur7G-6Fi-fc7jypfJfXZ5h8TUr4sT-LaZJRI9k~fD0QLqDaGtKBzHDlgO7H6XJN18iYF5GDwz2MlsZ-wkY5G2-OSRJ1JplHxYLCsllhUsL15ZG9ShMaPA__&Key-Pair-Id=K38HBHX5LX3X2H"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: FFmpeg en Pillow beschikbaar maken
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check pillow
          python -c "import PIL; print(PIL.__version__)"
      - name: Haal de afgeronde HeyGen D05 op
        run: |
          curl --fail --location --silent --show-error --retry 3 "$D05_VIDEO_URL" -o /tmp/d05_roadie_source.mp4
          curl --fail --location --silent --show-error --retry 3 "$D05_SUBTITLE_URL" -o /tmp/d05_roadie_subtitles.srt
          ffprobe -v error -show_entries stream=codec_type -of compact /tmp/d05_roadie_source.mp4
      - name: Maak exacte, bewegende ficheverdeling en stemmontage
        run: |
          python scripts/render-roadie-d05.py /tmp/d05_roadie_source.mp4 public/films/rekenklaar/D05/flirt.mp4
          ffmpeg -y -v error -ss 33 -i public/films/rekenklaar/D05/flirt.mp4 -frames:v 1 -q:v 2 public/films/rekenklaar/D05/poster.jpg
          node scripts/finish-roadie-d05.mjs /tmp/d05_roadie_subtitles.srt
      - name: Werk het bijbehorende Pabo-auditbewijs bij
        run: npm run audit:update
      - name: Controleer inhoud, audio en ondertiteling vóór het committen
        run: |
          node scripts/test-roadie-release.mjs
          node scripts/test-ownvoice-release.mjs
          node scripts/test-pabo-flirts.mjs
      - name: Commit alleen bij geslaagde verificatie, verwijder tijdelijke workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/build-d05-once.yml
          git add public/films/rekenklaar/D05/flirt.mp4 public/films/rekenklaar/D05/poster.jpg public/films/rekenklaar/D05/captions.vtt public/assets/data/grabbelton-videos.json public/assets/data/flirt-content-review.json public/assets/data/pabo-release-audit.json
          git commit -m "D05 Roadie: vloeiend uitlegbeeld met zichtbare herverdeling en eigen stem"
          git push origin HEAD:publish/d05-roadie-20261111
