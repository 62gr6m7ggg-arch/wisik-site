name: Wisik kwaliteitscontrole
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'
concurrency:
  group: wisik-release-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
  checks: write
jobs:
  release-gate:
    name: Verplichte vrijgavecontrole
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bepaal uitsluitend de betrokken modules
        id: scope
        run: node scripts/classify-release-change.mjs
      - name: Zorg dat FFmpeg en FFprobe beschikbaar zijn voor mediacontroles
        if: steps.scope.outputs.media == 'true'
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Eenmalige controle van de geselecteerde modules
        run: node scripts/release-check.mjs --write
      - name: Sla uitsluitend gegenereerde bewijzen op zonder tweede testronde
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release-store-reports.mjs
      - name: Bewaar resultaat en hervatpunt
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: wisik-vrijgavebewijs
          include-hidden-files: true
          path: |
            .release/
            public/assets/data/pabo-release-audit.json
            public/assets/data/ruimteklaar-release-audit.json
          if-no-files-found: warn
          retention-days: 14
