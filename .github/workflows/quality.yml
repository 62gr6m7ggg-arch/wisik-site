name: Wisik kwaliteitscontrole

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: wisik-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-gate:
    name: Verplichte vrijgavecontrole
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Controleer auditbewijs, site en Pabo-release
        run: npm run check
      - name: Publiceer controlebewijs als workflow-artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wisik-vrijgavebewijs
          path: public/assets/data/pabo-release-audit.json
          if-no-files-found: error
