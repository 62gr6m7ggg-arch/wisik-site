name: Wisik kwaliteitscontrole
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'
concurrency:
  group: wisik-release-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  release-gate:
    name: Verplichte vrijgavecontrole
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bepaal uitsluitend de betrokken modules
        id: scope
        run: node scripts/classify-release-change.mjs
      - name: Installeer FFmpeg alleen voor mediacontroles
        if: steps.scope.outputs.media == 'true'
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release
      - name: Eenmalige controle van de geselecteerde modules
        run: node scripts/release-check.mjs
      - name: Bewaar resultaat en hervatpunt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wisik-vrijgavebewijs
          include-hidden-files: true
          path: .release/
          if-no-files-found: warn
          retention-days: 14
