name: Wisik kwaliteitscontrole

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Controleer site, Pabo-release en Kladblokfunctie
        run: npm run check

  patch-kladblok-branch:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/kladblok-cloudflare-gratis-mail
      - name: Pas de Kladblok-submitroute gecontroleerd aan
        run: python scripts/patch-feedback-browser-post.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Controleer JavaScript-syntaxis
        run: node --check public/assets/js/site.js
      - name: Leg de wijziging vast op de Kladblok-branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "wisik-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/assets/js/site.js
          git commit -m "Laat gevalideerde Kladbloknotities via de browser bezorgen"
          git push origin HEAD:fix/kladblok-cloudflare-gratis-mail
