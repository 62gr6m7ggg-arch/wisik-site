name: Kladblok visuele nacontrole
on:
  push:
    branches: [privacy-live-controle-20260917]
    paths: ['.github/workflows/kladblok-ui-afronden.yml', 'scripts/prepare-kladblok-ui.py']
permissions:
  contents: read
concurrency:
  group: kladblok-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduceer de echte volgordefout vóór herstel
        run: |
          test "$GITHUB_REF" = refs/heads/privacy-live-controle-20260917
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 825386d81dd222c945f432f8313bf5e0248492c8
          git merge-base --is-ancestor 7215118aa6d57ca1bcb2f7d561ae2c3865dfc841 HEAD
          mkdir -p /tmp/wisik-privacy-proof
          python3 scripts/prepare-kladblok-ui.py checks
          if node scripts/test-privacy-terrein.mjs >/tmp/wisik-privacy-proof/verwacht-rode-volgordetest.txt 2>&1; then
            echo 'De nieuwe test moet de aangetoonde dubbele melding eerst afkeuren'; exit 1
          fi
          grep -F 'één bronmelding na initialisatie: fallback-first' /tmp/wisik-privacy-proof/verwacht-rode-volgordetest.txt
      - name: Herstel alleen Kladblokweergave en toets beide initialisatievolgordes
        run: |
          python3 scripts/prepare-kladblok-ui.py fix
          rm scripts/prepare-kladblok-ui.py
          node --check public/assets/js/site.js
          node scripts/test-privacy-terrein.mjs
          node scripts/test-feedback.mjs
          node scripts/test-pabo-navigation.mjs
      - name: Installeer geïsoleerde testbrowsers
        run: |
          npm install --prefix /tmp/privacy-browser --no-save playwright@1.56.1 >/tmp/kladblok-install.log 2>&1 || { tail -100 /tmp/kladblok-install.log; exit 1; }
          /tmp/privacy-browser/node_modules/.bin/playwright install --with-deps chromium webkit >>/tmp/kladblok-install.log 2>&1 || { tail -100 /tmp/kladblok-install.log; exit 1; }
      - name: Controleer één zichtbare melding, smalle invoervelden en ongewijzigde privacywerking
        env:
          PLAYWRIGHT_MODULE: /tmp/privacy-browser/node_modules/playwright/index.mjs
        run: node scripts/check-privacy-terrein-browser.mjs
      - name: Vernieuw brongebonden bewijs en voer alle vrijgavecontroles uit
        run: |
          node scripts/audit-pabo-release.mjs --write
          node scripts/audit-space-release.mjs --write
          npm run build
      - name: Bewaak appbron, leerlogica, opslag, media en server
        run: |
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const base='825386d81dd222c945f432f8313bf5e0248492c8';
          const paths=['src/pabo','tools/space-tent','server','functions','public/apps','public/films','public/_headers','public/_routes.json'];
          const files=execFileSync('git',['diff','--name-only',base,'--',...paths],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          for(const file of files){
            const before=execFileSync('git',['show',base+':'+file],{encoding:'utf8'});
            const after=fs.readFileSync(file,'utf8');
            assert.equal(after.replaceAll('?v=0.1.30','?v=0.1.29'),before,'Buiten Kladblok uitsluitend cacheverwijzingen: '+file);
          }
          console.log(JSON.stringify({appLogicStorageServerMediaUnchanged:true,cacheOnlyFiles:files}));
          JS
      - name: Leg uitsluitend geteste wijzigingen vast op de werkbranch
        run: |
          test "$GITHUB_REF" = refs/heads/privacy-live-controle-20260917
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 825386d81dd222c945f432f8313bf5e0248492c8
          test "$(git ls-remote origin refs/heads/privacy-live-controle-20260917 | cut -f1)" = "$GITHUB_SHA"
          rm .github/workflows/kladblok-ui-afronden.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Wisik 0.1.30: één Kladblokbronmelding en leesbaar smal formulier, met regressiebewijs'
          git push origin HEAD:privacy-live-controle-20260917
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kladblok-visuele-nacontrole
          path: /tmp/wisik-privacy-proof/
          retention-days: 14
