name: Pabo denkvariatie controle
on:
  push:
    branches: [feat/pabo-denkvariatie-20260917]
    paths:
      - '.github/workflows/pabo-denkvariatie.yml'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export tracked source without credentials or media
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, subprocess
          names = subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          allowed = {'.html','.js','.mjs','.cjs','.json','.md','.py','.yml','.yaml','.css','.txt','.toml','.svg'}
          with zipfile.ZipFile('/tmp/pabo-current-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in names:
                  p=Path(name)
                  if name and p.is_file() and p.suffix in allowed and p.stat().st_size < 4000000:
                      z.write(p,name)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pabo-current-source
          path: /tmp/pabo-current-source.zip
          retention-days: 3
