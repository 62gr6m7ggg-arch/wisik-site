name: Gonio hostingcontrole kandidaat voorbereiden
on:
  push:
    branches: ['diagnostic/gonio-live-20261107']
    paths: ['.github/workflows/gonio-live-diagnostic.yml']
permissions:
  contents: write
jobs:
  prepare:
    if: github.ref == 'refs/heads/diagnostic/gonio-live-20261107'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnostic/gonio-live-20261107
      - name: Bereid uitsluitend de kandidaatpatch voor
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          def replace(s, old, new):
              assert s.count(old)==1, (old,s.count(old))
              return s.replace(old,new)
          root=Path('public/rafelrand/sinus-s-en-de-geit')
          p=root/'index.html';s=p.read_text()
          s=replace(s,'Geen account, geen gegevensverzending vanuit deze tent, geen leerlingdossier.','Geen account of leerlingdossier. De hosting voegt een Cloudflare-statistiekenscript toe; de begripchecks zelf blijven lokaal.')
          s=replace(s,'PROEFTENT · ANALYSE 2B · 0.2.0','PROEFTENT · ANALYSE 2B · 0.2.1')
          s=replace(s,'proeftent 0.2.0.','proeftent 0.2.1.')
          s=replace(s,'./mixer.js?v=0.2.0','./mixer.js?v=0.2.1')
          p.write_text(s)
          p=root/'mixer.js';s=p.read_text()
          s=replace(s,'Geen externe speler, tracking of microfoontoegang. Versie 0.2.0.','De geitenproef gebruikt geen externe speler of microfoon. De hosting voegt een Cloudflare-statistiekenscript toe. Versie 0.2.1.')
          s=replace(s,'/* Wisik 0.2.0:','/* Wisik 0.2.1:')
          p.write_text(s)
          p=Path('tests/gonio-browser.py');s=p.read_text()
          s=replace(s,'from playwright.sync_api import sync_playwright','from playwright.sync_api import sync_playwright\nfrom gonio_integrity import compare_source')
          s=replace(s,"    expected=hashlib.sha256((ROOT/'public'/PATH.strip('/')/'index.html').read_bytes()).hexdigest()","    expected_bytes=(ROOT/'public'/PATH.strip('/')/'index.html').read_bytes()\n    expected=hashlib.sha256(expected_bytes).hexdigest()")
          s=replace(s,'                actual=hashlib.sha256(live).hexdigest()','                actual=hashlib.sha256(live).hexdigest()\n                identity=compare_source(expected_bytes,live,\'index.html\')')
          s=replace(s,"            (OUT/'source-identity.json').write_text(json.dumps(evidence,indent=2))","            evidence.update(identity)\n            (OUT/'source-identity.json').write_text(json.dumps(evidence,indent=2))")
          s=replace(s,'            if actual==expected:','            if identity[\'verified\']:')
          s=replace(s,"                print('Production HTML matches the tested commit exactly.',flush=True)","                print('Application HTML verified. Raw match:',identity['raw_equal'],'Hosting addition:',identity['hosting_addition'],flush=True)")
          p.write_text(s)
          p=Path('tests/gonio-audio-browser.py');s=p.read_text()
          s=replace(s,'from playwright.sync_api import sync_playwright','from playwright.sync_api import sync_playwright\nfrom gonio_integrity import compare_source')
          s=replace(s,"        expected=hashlib.sha256((ROOT/'public'/ROUTE.strip('/')/name).read_bytes()).hexdigest()","        expected_bytes=(ROOT/'public'/ROUTE.strip('/')/name).read_bytes()\n        identity=compare_source(expected_bytes,fetched.body(),name)")
          s=replace(s,"        assert actual==expected,(name,'HTTP source differs from tested candidate')","        assert identity['verified'],(name,'HTTP source differs from tested candidate',identity)")
          s=replace(s,'        identities[name]=actual','        identities[name]=identity')
          p.write_text(s)
          p=Path('.github/workflows/gonio.yml');s=p.read_text()
          s=replace(s,'          node scripts/test-gonio.mjs','          python tests/gonio_integrity.py\n          node scripts/test-gonio.mjs')
          p.write_text(s)
          out=Path('test-artifacts/gonio-hosting-candidate');out.mkdir(parents=True,exist_ok=True)
          for name in ['index.html','mixer.js']:shutil.copy2(root/name,out/name)
          for name in ['gonio-browser.py','gonio-audio-browser.py','gonio_integrity.py']:shutil.copy2(Path('tests')/name,out/name)
          PY
          python tests/gonio_integrity.py
          python -m py_compile tests/gonio-browser.py tests/gonio-audio-browser.py tests/gonio_integrity.py
          node scripts/test-gonio.mjs
          node --check public/rafelrand/sinus-s-en-de-geit/mixer.js
      - name: Commit alleen de kandidaat; verwijder deze tijdelijke voorbereiding
        run: |
          git config user.name 'Wisik preparation bot'
          git config user.email 'wisik-preparation@users.noreply.github.com'
          git add public/rafelrand/sinus-s-en-de-geit/index.html public/rafelrand/sinus-s-en-de-geit/mixer.js tests/gonio-browser.py tests/gonio-audio-browser.py .github/workflows/gonio.yml
          git rm .github/workflows/gonio-live-diagnostic.yml
          git commit -m 'fix(gonio): verify exact application bytes and disclose hosting statistics, 0.2.1'
          git push origin HEAD:refs/heads/diagnostic/gonio-live-20261107
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gonio-hosting-candidate
          path: test-artifacts/gonio-hosting-candidate/
          if-no-files-found: warn
