name: Konijnenhol - statische ingangen voorbereiden
on:
  push:
    branches: [feat/konijnenhol]
    paths:
      - scripts/install-konijnenhol.mjs
      - .github/workflows/konijnenhol-prepare.yml
permissions:
  contents: write
concurrency:
  group: konijnenhol-prepare
  cancel-in-progress: false
jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/install-konijnenhol.mjs
      - run: node scripts/test-konijnenhol.mjs
      - name: Bewaar uitsluitend de ingangen en publicatievoorwaarde
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html public/rafelrand/index.html public/rafelrand/space-tent/index.html package.json
          git diff --cached --quiet && exit 0
          git commit -m 'Plaats Konijnenhol naast Space-tent; blokkeer publicatie zonder gecontroleerde film'
          git push origin HEAD:feat/konijnenhol
