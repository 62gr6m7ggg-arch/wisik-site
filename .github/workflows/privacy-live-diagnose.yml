name: Privacy live diagnose
on:
  push:
    branches: [privacy-live-controle-20260917]
    paths: ['.github/workflows/privacy-live-diagnose.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lees de echte HTTP-respons van de livecontrole
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const expected=fs.readFileSync('public/backstage/index.html');
          const response=await fetch('https://wisik.nl/backstage/?privacy-check='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(25000)});
          const actual=Buffer.from(await response.arrayBuffer());
          const sha=b=>crypto.createHash('sha256').update(b).digest('hex');
          console.log(JSON.stringify({status:response.status,url:response.url,headers:Object.fromEntries(response.headers),expectedSha256:sha(expected),servedSha256:sha(actual),byteEqual:expected.equals(actual),expectedLength:expected.length,servedLength:actual.length},null,2));
          if(!response.ok) console.log('HTTP-FOUTRESPONS:',actual.toString('utf8').slice(0,6000));
          else if(!expected.equals(actual)) {
            const e=expected.toString('utf8'),a=actual.toString('utf8');
            let first=0;while(first<e.length&&first<a.length&&e[first]===a[first])first++;
            console.log(JSON.stringify({firstDifference:first,expected:e.slice(Math.max(0,first-200),first+4000),served:a.slice(Math.max(0,first-200),first+4000)},null,2));
          }
          JS
