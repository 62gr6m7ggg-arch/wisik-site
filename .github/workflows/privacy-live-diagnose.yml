name: Privacy nacontrole en herstel testverwachtingen
on:
  push:
    branches: [privacy-live-controle-20260917]
    paths:
      - '.github/workflows/privacy-live-diagnose.yml'
      - 'scripts/prepare-privacy-live-check.py'
      - 'scripts/*privacy*.mjs'
      - 'scripts/check-pabo-nav-browser.mjs'
permissions:
  contents: read
concurrency:
  group: privacy-nacontrole-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pas uitsluitend de gecontroleerde testcorrecties toe
        run: |
          test "$GITHUB_REF" = refs/heads/privacy-live-controle-20260917
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 825386d81dd222c945f432f8313bf5e0248492c8
          python3 scripts/prepare-privacy-live-check.py
          rm scripts/prepare-privacy-live-check.py
          node scripts/test-deployed-privacy-file.mjs
          node scripts/test-privacy-terrein.mjs
          node --check scripts/check-privacy-terrein-browser.mjs
          node --check scripts/check-pabo-nav-browser.mjs
      - name: Installeer geïsoleerde testbrowsers
        run: |
          npm install --prefix /tmp/privacy-browser --no-save playwright@1.56.1 >/tmp/privacy-install.log 2>&1 || { tail -100 /tmp/privacy-install.log; exit 1; }
          /tmp/privacy-browser/node_modules/.bin/playwright install --with-deps chromium webkit >>/tmp/privacy-install.log 2>&1 || { tail -100 /tmp/privacy-install.log; exit 1; }
      - name: Controleer privacy en Pabo-navigatie lokaal
        env:
          PLAYWRIGHT_MODULE: /tmp/privacy-browser/node_modules/playwright/index.mjs
        run: |
          node scripts/check-privacy-terrein-browser.mjs
          node scripts/check-pabo-nav-browser.mjs
      - name: Behoud alle bestaande vrijgavecontroles
        run: npm run build
      - name: Controleer echte productie en echte browserbediening
        env:
          PLAYWRIGHT_MODULE: /tmp/privacy-browser/node_modules/playwright/index.mjs
          LIVE_ORIGIN: https://wisik.nl
        run: |
          node scripts/check-privacy-terrein-browser.mjs
          node scripts/check-pabo-nav-browser.mjs
          cp /tmp/wisik-privacy-proof/privacy-browser-report.json docs/privacy-terrein-live-evidence.json
          cp /tmp/pabo-nav-evidence/results.json docs/pabo-nav-live-evidence-20260917.json
      - name: Bewaak ongewijzigde productie en leg alleen gecontroleerde tests vast
        run: |
          test "$GITHUB_REF" = refs/heads/privacy-live-controle-20260917
          git diff --exit-code 825386d81dd222c945f432f8313bf5e0248492c8 -- public src tools server functions package.json package-lock.json
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 825386d81dd222c945f432f8313bf5e0248492c8
          test "$(git ls-remote origin refs/heads/privacy-live-controle-20260917 | cut -f1)" = "$GITHUB_SHA"
          rm .github/workflows/privacy-live-diagnose.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Bevestig privacyrelease online; behoud Cloudflare-bescherming en brongebonden versiechecks'
          git push origin HEAD:privacy-live-controle-20260917
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: privacy-nacontrole-en-navigatie
          path: |
            /tmp/wisik-privacy-proof/
            /tmp/pabo-nav-evidence/
          retention-days: 14
