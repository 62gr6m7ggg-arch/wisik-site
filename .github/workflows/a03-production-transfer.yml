name: Synchroniseer live A03 met GitHub
on:
  push:
    branches: [maintenance/a03-production-transfer]
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e42341ec74e0ce870ed6ac7fcb2e20bdf797b316
      - name: Neem de bestaande productieversie over
        shell: bash
        run: |
          git switch -c sync/a03-production-12acebac
          while read -r sha path; do
            curl --fail --silent --show-error --retry 2 --connect-timeout 10 --max-time 60 \
              --output "public/$path" "https://12acebac.wisik-site.pages.dev/$path"
            printf '%s  %s\n' "$sha" "public/$path" | sha256sum --check
            git add -- "public/$path"
          done <<'ASSETS'
          66f88505b6c74686e2cde1bdf92a38ea9217523f98f1e49031434f33e462af60 films/rekenklaar/A03/flirt.mp4
          639f8ac646fa8ad75a2316d5621ff7ed3bfc7cf39c038878a281efda9b4d9131 films/rekenklaar/A03/poster.jpg
          f3ba84ad2688e03eca6f511bb9e1720431e59cd007e7e9b095116b07cddb7535 films/rekenklaar/A03/captions.vtt
          26d466194a6bfa1da43670643ce3de46b7606fd24af8ef30419762abc07591d8 films/rekenklaar/A03/transcript.html
          fb7d4733d36a04f97785f42aeced5d8d8ddefb7946124079b9464d1c83220314 assets/data/grabbelton-videos.json
          c4fa2e133de75763fabeea809b7c50a25770ba36ba648936341857659b4a38bf assets/data/flirt-content-review.json
          3d1dee69ea659f64c67038a79f5bf379597255eb495256f525b3b7d567b6ac55 assets/js/grabbelton.js
          13a35fce2135a406a6b07a40ae5bb45d9d52b60ef4598acab50085733ff1869e grabbelton/index.html
          b1f6182ca205f9c1b86d2101e2001a01fb47f555a0b657e37c84943a66804610 apps/pabo-rekenklaar/index.html
          ASSETS
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'A03: neem de bestaande Cloudflare-productieversie over'
          git push origin HEAD:refs/heads/sync/a03-production-12acebac
