name: Voeg broncontext toe aan het Kladblok

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-kladblok-context.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Voeg bronpagina en attractieversie toe
        run: python scripts/patch-kladblok-context.py
      - name: Leg de wijziging vast
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Kladblokcontext stond al goed."
            exit 0
          fi
          git config user.name "wisik-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/kladblok/index.html
          git commit -m "Stuur bronpagina en attractieversie mee met Kladbloknotities"
          git push origin HEAD:main
