name: Ruimteklaar desktopwerkplek
on:
  push:
    branches: [feat/construction-desktop]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/space-tent/package-lock.json
      - run: npm ci
        working-directory: tools/space-tent
      - run: npm run build && npm run audit:build && npm test && node scripts/build-review.mjs
        working-directory: tools/space-tent
      - name: Install test browsers
        run: |
          npm install --prefix /tmp/workspace-browser --no-save playwright@1.56.1
          /tmp/workspace-browser/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Check desktop layout and all construction interactions
        working-directory: tools/space-tent
        env:
          PLAYWRIGHT_MODULE: /tmp/workspace-browser/node_modules/playwright/index.mjs
        run: |
          node scripts/check-desktop-workspace.mjs
          node scripts/check-selection-browser.mjs
          node scripts/check-construction-next-browser.mjs
          node scripts/check-review-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-workspace-screenshots
          path: tools/space-tent/.workspace-browser/
          include-hidden-files: true
          retention-days: 7
      - name: Bind verified source, evidence and assets
        run: |
          cp tools/space-tent/.workspace-browser/results.json tools/space-tent/validation/desktop-workspace-046.json
          rm -rf public/apps/ruimteklaar/assets
          cp -a tools/space-tent/.space-dist/. public/apps/ruimteklaar/
          cp -a tools/space-tent/.audit-dist/. tools/space-tent/audit-runtime/
          node scripts/audit-space-release.mjs --write
          node scripts/audit-ruimteklaar-review.mjs --write
          npm run build
      - name: Commit verified release to isolated branch
        run: |
          test "$(git ls-remote origin refs/heads/feat/construction-desktop | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/apps/ruimteklaar tools/space-tent/audit-runtime tools/space-tent/validation/desktop-workspace-046.json public/assets/data/ruimteklaar-release-audit.json server/ruimteklaar-test-assets.mjs server/ruimteklaar-test-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Build and verify Ruimteklaar 0.4.6 desktop workspace'
            git push origin HEAD:feat/construction-desktop
          fi
