name: Trim oude flirt-slotkaarten

on:
  push:
    branches:
      - fix/flirt-slotbeeld-zonder-herstelset

permissions:
  contents: write

jobs:
  build-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/flirt-slotbeeld-zonder-herstelset
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installeer media-analyse
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check pillow
      - name: Detecteer en verwijder oude statische eindkaarten
        run: python scripts/trim-flirt-endcards.py
      - name: Vernieuw Pabo-auditbewijs
        run: npm run audit:update
      - name: Vernieuw Ruimteklaar-auditbewijs
        run: node scripts/audit-space-release.mjs --write
      - name: Controleer volledige release
        run: npm run check
      - name: Commit gecontroleerde videofix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json public scripts/test-ownvoice-release.mjs scripts/test-flirt-endcards.mjs tests/flirt-endcard-trim-2026-09-09.json
          git diff --cached --quiet && exit 0
          git commit -m 'Verwijder ingebakken herstelset-slotkaart uit alle 30 flirts'
          git push origin HEAD:fix/flirt-slotbeeld-zonder-herstelset
