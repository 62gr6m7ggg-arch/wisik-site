name: Space-tent Tentamenarena
on:
  push:
    branches: [space-tentamenarena-20261010]
    paths:
      - '.github/workflows/space-tentamenarena.yml'
      - 'tools/space-tent/tentamenarena-package/**'
permissions:
  contents: read
concurrency:
  group: space-arena-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect current course and require complete payload
        id: payload
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const root='tools/space-tent/';
          const a=JSON.parse(fs.readFileSync(root+'app/content.json'));
          const b=JSON.parse(fs.readFileSync(root+'app/course-content.json'));
          console.log('COURSE BLOCKS '+JSON.stringify([...a.blocks,...b.blocks].map(x=>({id:x.id,level:x.level||1,title:x.title})),null,2));
          console.log('ROOT BUILD '+fs.readFileSync('package.json','utf8'));
          const file=root+'tentamenarena-package/Spacetent_Tentamenarena_1.1.html';
          const ready=fs.existsSync(file);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'ready='+ready+'\n');
          if(!ready)console.log('Complete source payload is not in this branch yet. No installation, build, deployment or success claim.');
          JS
      - uses: actions/setup-node@v4
        if: steps.payload.outputs.ready == 'true'
        with:
          node-version: '22'
      - name: Verify payload and install guarded integration
        if: steps.payload.outputs.ready == 'true'
        run: |
          node tools/space-tent/tentamenarena-package/integratie/install.mjs .
          node tools/space-tent/tentamenarena-package/integratie/install.mjs . --apply
      - name: Install locked course dependencies
        if: steps.payload.outputs.ready == 'true'
        run: npm ci --no-audit --no-fund
        working-directory: tools/space-tent
      - name: Course, type and build checks
        if: steps.payload.outputs.ready == 'true'
        working-directory: tools/space-tent
        run: |
          npx tsc --noEmit
          node scripts/check-shape-variation.mjs
          node scripts/check-course.mjs
          npm test
          node scripts/check-curriculum-contracts.mjs
          node scripts/check-entry-choice.mjs
          npm run build
          npm run audit:build
          node scripts/build-entry-audit.mjs
          node scripts/build-review.mjs
      - name: Install real browser engines
        if: steps.payload.outputs.ready == 'true'
        run: |
          npm install --prefix /tmp/space-arena-browser --no-save --no-audit playwright@1.56.1
          /tmp/space-arena-browser/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Stage verified build for browser checks
        if: steps.payload.outputs.ready == 'true'
        run: |
          node -e "const f=require('node:fs');f.rmSync('public/apps/ruimteklaar',{recursive:true,force:true});f.cpSync('tools/space-tent/.space-dist','public/apps/ruimteklaar',{recursive:true});f.cpSync('tools/space-tent/.audit-dist','tools/space-tent/audit-runtime',{recursive:true});"
      - name: Integrated arena and all retained browser regressions
        if: steps.payload.outputs.ready == 'true'
        working-directory: tools/space-tent
        env:
          PLAYWRIGHT_MODULE: /tmp/space-arena-browser/node_modules/playwright/index.mjs
        run: |
          node tentamenarena-package/integratie/check-native.mjs
          node scripts/check-shape-browser.mjs
          node scripts/check-shape-variation.mjs --browser --write
          node scripts/check-entry-choice-browser.mjs
          node scripts/check-knowledge-browser.mjs
          node scripts/check-desktop-workspace.mjs
          node scripts/check-level-continuation-browser.mjs
          node scripts/check-review-browser.mjs
      - name: Bind release evidence and run site-wide checks
        if: steps.payload.outputs.ready == 'true'
        run: |
          cp tools/space-tent/.entry-browser/results.json tools/space-tent/validation/free-entry-054.json
          cp tools/space-tent/.knowledge-browser/results.json tools/space-tent/validation/knowledge-browser-050.json
          cp tools/space-tent/.workspace-browser/results.json tools/space-tent/validation/desktop-workspace-050.json
          cp tools/space-tent/.review-browser/results.json tools/space-tent/validation/review-mode-100.json
          npm run seo:build
          node scripts/audit-ruimteklaar-review.mjs --write
          node scripts/audit-space-release.mjs --write
          npm run build
      - name: Save only the checked candidate to the work branch
        if: steps.payload.outputs.ready == 'true'
        run: |
          test "$(git ls-remote origin refs/heads/space-tentamenarena-20261010 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/space-tent/app tools/space-tent/space/index.html tools/space-tent/review/index.html tools/space-tent/scripts/build-space.mjs tools/space-tent/audit-runtime tools/space-tent/validation public/apps/ruimteklaar public/hbo/space-tent/index.html public/backstage/space-tent/index.html public/assets/js/site-data.js public/films/ruimteklaar/catalog.json public/assets/data/ruimteklaar-release-audit.json server/ruimteklaar-test-assets.mjs server/ruimteklaar-test-manifest.json scripts/audit-space-release.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'Space-tent 0.7.0: verified Tentamenarena 1.1 with 2018 exam and explicit reconstruction'
            git push origin HEAD:space-tentamenarena-20261010
          fi
      - uses: actions/upload-artifact@v4
        if: always() && steps.payload.outputs.ready == 'true'
        with:
          name: tentamenarena-release-evidence
          include-hidden-files: true
          path: |
            tools/space-tent/.arena-browser
            tools/space-tent/validation/tentamenarena-110.json
            tools/space-tent/.shape-browser
            tools/space-tent/.knowledge-browser
            tools/space-tent/.workspace-browser
            tools/space-tent/.review-browser
          retention-days: 14
