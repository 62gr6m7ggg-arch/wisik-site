name: Refresh own-voice review

on:
  push:
    branches: [feat/pabo-eigenstem-alle-flirts]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pabo-eigenstem-alle-flirts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Werk review, Safari-sync en siteversie 0.1.21 bij
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json

          review_path = Path('public/assets/data/flirt-content-review.json')
          review = json.loads(review_path.read_text())
          review['reviewedAt'] = '2026-09-09'
          review['scope']['audio'] = ('De nieuwe eigenstemopnamen A–D zijn op 9 september opnieuw technisch en tekstueel gecontroleerd. '
            'Voor D01 is de volledige slotconclusie teruggezet en opnieuw vergeleken met het canonieke foutpatroon. '
            'De masteraudio en alle 30 segmenttijden worden apart bewaakt in tests/pabo-eigenstem-review-2026-09-09.json. '
            'Geen onafhankelijke menselijke tweede beluisteraar.')
          entry = next(item for item in review['entries'] if item['code'] == 'D01')
          entry['observedContent'] = ('De eigen stem vergelijkt 10→30→35→40: de grootste toename is +20 in het eerste jaar, '
            'terwijl de hoogste eindwaarde 40 rechts ligt. De volledige slotconclusie maakt expliciet dat waar je het hoogst '
            'uitkomt niet automatisch de plaats van de grootste stijging is. Dit sluit aan op het canonieke denkpatroon.')
          entry['captionEvidence'] = ('De Nederlandse cues volgen de volledige eigen stem en bevatten nu ook de slotconclusie dat '
            'waar je het hoogst uitkomt niet automatisch is waar je het hardst bent gestegen.')
          entry['fingerprints']['captions'] = hashlib.sha256(Path('public/films/rekenklaar/D01/captions.vtt').read_bytes()).hexdigest()
          entry['fingerprints']['transcript'] = hashlib.sha256(Path('public/films/rekenklaar/D01/transcript.html').read_bytes()).hexdigest()
          review_path.write_text(json.dumps(review, ensure_ascii=False, indent=2) + '\n')

          core_path = Path('public/assets/js/grabbelton-core.js')
          core = core_path.read_text()
          old = '''    const syncAudio = (force = false) => {\n      if (!Number.isFinite(audio.duration) || !Number.isFinite(player.currentTime)) return;\n      const target = Math.min(clipEnd - 0.04, targetAudioTime());\n      if (force || Math.abs(audio.currentTime - target) > 0.22) {\n        try { audio.currentTime = target; } catch {}\n      }\n    };'''
          new = '''    let pendingInitialSync = false;\n    const syncAudio = (force = false) => {\n      if (!Number.isFinite(audio.duration) || !Number.isFinite(player.currentTime)) return false;\n      const target = Math.min(clipEnd - 0.04, targetAudioTime());\n      if (force || Math.abs(audio.currentTime - target) > 0.22) {\n        try { audio.currentTime = target; } catch { return false; }\n      }\n      return true;\n    };\n    const finishInitialSync = () => {\n      if (!pendingInitialSync) return;\n      pendingInitialSync = false;\n      audio.volume = player.volume;\n      if (!player.paused) audio.play().catch(() => player.pause());\n    };\n    audio.addEventListener("loadedmetadata", () => {\n      if (!pendingInitialSync || !syncAudio(true)) return;\n      if (audio.seeking) audio.addEventListener("seeked", finishInitialSync, { once: true });\n      else finishInitialSync();\n    });'''
          if old in core:
              core = core.replace(old, new, 1)
              old_play = '''      activeBinding = { player, audio };\n      syncAudio(true);\n      audio.volume = player.volume;\n      try { await audio.play(); }'''
              new_play = '''      activeBinding = { player, audio };\n      const aligned = syncAudio(true);\n      pendingInitialSync = !aligned;\n      audio.volume = aligned ? player.volume : 0;\n      try { await audio.play(); }'''
              assert old_play in core, 'verwachte play-code niet gevonden'
              core = core.replace(old_play, new_play, 1)
          elif 'let pendingInitialSync = false;' not in core:
              raise AssertionError('verwachte syncAudio-code niet gevonden')

          old_document = '''  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", initializeOwnVoice, { once: true });\n  else initializeOwnVoice();'''
          new_document = '''  if (globalThis.document) {\n    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", initializeOwnVoice, { once: true });\n    else initializeOwnVoice();\n  }'''
          if old_document in core:
              core = core.replace(old_document, new_document, 1)
          elif 'if (globalThis.document)' not in core:
              raise AssertionError('verwachte document-initialisatie niet gevonden')
          core_path.write_text(core)

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          package['version'] = '0.1.21'
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n')

          for path in Path('public').rglob('*'):
              if not path.is_file() or path.suffix.lower() not in {'.html','.js','.json','.css','.webmanifest','.txt'}:
                  continue
              try:
                  text = path.read_text()
              except UnicodeDecodeError:
                  continue
              updated = text.replace('0.1.20-eigenstem-20260909', '0.1.21').replace('0.1.20', '0.1.21')
              if updated != text:
                  path.write_text(updated)

          test_path = Path('scripts/test-ownvoice-release.mjs')
          test = test_path.read_text().replace('grabbelton-core.js?v=0.1.20-eigenstem-20260909', 'grabbelton-core.js?v=0.1.21')
          test_path.write_text(test)
          PY
      - name: Werk openbaar Pabo-auditbewijs bij
        run: npm run audit:update
      - name: Werk Ruimteklaar-auditbewijs bij voor siteversie
        run: node scripts/audit-space-release.mjs --write
      - name: Controleer volledige release
        run: npm run check
      - name: Commit gecontroleerde release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json public scripts/test-ownvoice-release.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Finaliseer eigenstemrelease als Wisik 0.1.21'
          git push origin HEAD:feat/pabo-eigenstem-alle-flirts
